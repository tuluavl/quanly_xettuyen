<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Hệ Thống Quản Lý Xét Tuyển</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #222d32;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .login-header {
            background-color: #f39c12;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .btn-warning-custom {
            background-color: #f39c12;
            color: white;
            font-weight: bold;
        }
        .btn-warning-custom:hover {
            background-color: #e08e0b;
            color: white;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <h4 class="m-0 fw-bold"><i class="fa-solid fa-user-shield me-2"></i>QUẢN LÝ XÉT TUYỂN</h4>
        <small class="text-white-50">Đăng nhập hệ thống</small>
    </div>
    <div class="card-body p-4">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger py-2 fs-7" role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label font-weight-bold fs-7">Tên đăng nhập</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                    <input type="text" name="username" class="form-control" placeholder="Nhập username" required>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label font-weight-bold fs-7">Mật khẩu</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="Nhập mật khẩu" required>
                </div>
            </div>
            <button type="submit" class="btn btn-warning-custom w-100 py-2">ĐĂNG NHẬP</button>
        </form>
    </div>
</div>

</body>
</html>
